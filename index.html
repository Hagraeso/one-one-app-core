<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One One | Digital Sanctuary</title>
    <style>
        :root {
            --primary-color: #004d5a; 
            --bg-color: #f8f9fa;
            --text-color: #2d3436;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container { max-width: 450px; width: 90%; padding: 20px; }
        
        /* ضبط مقاس اللوجو */
        .logo-img { 
            width: 150px; 
            height: auto; 
            margin-bottom: 20px;
        }

        .tagline { font-size: 1.1rem; color: #636e72; margin-bottom: 30px; }
        
        .stats-box { 
            background: #dfe6e9; 
            padding: 12px; 
            border-radius: 10px; 
            margin-bottom: 25px; 
            font-size: 0.9rem;
        }

        input[type="email"] { 
            padding: 15px; border: 1px solid #dfe6e9; border-radius: 8px; 
            font-size: 1rem; width: 100%; box-sizing: border-box; margin-bottom: 10px;
            text-align: center;
        }

        button { 
            padding: 15px; background-color: var(--primary-color); color: white; 
            border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; 
            font-weight: 600; width: 100%; transition: 0.2s;
        }
        button:hover { background-color: #003a44; }

        .features { margin-top: 40px; text-align: left; }
        .feature-item { 
            margin-bottom: 15px; padding-left: 15px; 
            border-left: 3px solid var(--primary-color);
            font-size: 0.95rem;
        }
        strong { color: var(--primary-color); }
    </style>
</head>
<body>

    <div class="container">
        <!-- ربط اللوجو الفعلي -->
        <img src="image_3.png" alt="One One Logo" class="logo-img">
        
        <p class="tagline">One post. One day. One you.</p>
        
        <div class="stats-box">
            Join the first 1,000 founding members. <b>842 joined so far.</b>
        </div>

        <form>
            <input type="email" placeholder="Enter your email for digital peace" required>
            <button type="submit">Join the Waitlist</button>
        </form>

        <div class="features">
            <div class="feature-item">
                1 post per day: Think before you share.
            </div>
            <div class="feature-item">
                Required context: Why does this matter today?
            </div>
            <div class="feature-item">
                Meaningful reactions: Interested, Inspired, Will Try.
            </div>
        </div>
    </div>

</body>
</html>
