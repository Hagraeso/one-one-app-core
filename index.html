
     <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneOne Waitlist</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background-color: #ccc; }
        #message { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>انضم لقائمة الانتظار</h2>
    <form id="waitlistForm">
        <input type="email" id="emailInput" placeholder="أدخل بريدك الإلكتروني" required>
        <button type="submit" id="submitBtn">تسجيل</button>
    </form>
    <div id="message"></div>
</div>

<script>
    const form = document.getElementById('waitlistForm');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    // استبدل الرابط اللي تحت برابط الـ Webhook بتاعك من Zapier
    const ZAPIER_WEBHOOK_URL = 'https://hooks.zapier.com/hooks/catch/27472410/uvxw2rt/';

    form.addEventListener('submit', async (e) => {
        e.preventDefault(); // منع الصفحة من التحديث
        
        const email = document.getElementById('emailInput').value;
        
        // تغيير حالة الزر أثناء الإرسال
        submitBtn.disabled = true;
        messageDiv.innerText = 'جاري الإرسال...';
        messageDiv.style.color = 'black';

        try {
            const response = await fetch(ZAPIER_WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors', // مهم جداً عشان GitHub Pages ما ترفضش الطلب (CORS)
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: email,
                    date: new Date().toLocaleString() // هيرسلك التاريخ كمان
                })
            });

            // بما أننا استخدمنا no-cors، مش هنعرف نقرأ الـ response بالظبط، بس الطلب هيوصل
            messageDiv.innerText = 'تم التسجيل بنجاح! شكراً لك.';
            messageDiv.style.color = 'green';
            form.reset(); // مسح الخانة بعد النجاح

        } catch (error) {
            console.error('Error:', error);
            messageDiv.innerText = 'حدث خطأ، حاول مرة أخرى.';
            messageDiv.style.color = 'red';
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
