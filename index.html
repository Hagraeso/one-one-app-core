<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One One | One Post. One Day.</title>
    <style>
        :root {
            --primary-color: #004d5c; /* اللون المستوحى من اللوجو image_3.png */
            --bg-color: #0A0A0A;
            --text-color: #E8E6E1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }

        .logo-container img {
            max-width: 200px; /* هنا نضع اللوجو image_3.png */
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        p.tagline {
            font-size: 1.1rem;
            font-style: italic;
            color: #888;
            max-width: 400px;
            line-height: 1.6;
        }

        .waitlist-form {
            margin-top: 40px;
            width: 100%;
            max-width: 400px;
        }

        input[type="email"] {
            width: 70%;
            padding: 12px;
            border-radius: 25px 0 0 25px;
            border: 1px solid #333;
            background: #111;
            color: white;
            outline: none;
        }

        button {
            width: 25%;
            padding: 12px;
            border-radius: 0 25px 25px 0;
            border: none;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.8;
        }

        .footer {
            margin-top: 60px;
            font-size: 0.8rem;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- تأكد أن ملف اللوجو image_3.png موجود في نفس المجلد على GitHub -->
        <img src="image_3.png" alt="One One Logo"> 
    </div>

    <h1>One One</h1>
    <p class="tagline">"The digital sanctuary for deep connections. One meaningful post, once a day."</p>

    <div class="waitlist-form">
        <form>
            <input type="email" placeholder="Enter your email" required>
            <button type="submit">Join</button>
        </form>
        <p style="font-size: 0.7rem; color: #555; margin-top: 10px;">Be the first to experience it in Malmö.</p>
    </div>

    <div class="footer">
        © 2026 ONE ONE. ALL RIGHTS RESERVED.
    </div>

</body>
</html>
